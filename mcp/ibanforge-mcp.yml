    required:
    - ibans
  annotations:
    title: Batch Validate IBANs
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
- name: lookup_bic
  description: 'Resolve a BIC / SWIFT code into the underlying bank: name, country, city, LEI, and registered
    head-office address (where available). USE WHEN: the user already has a BIC/SWIFT (8 or 11 chars,
    alphanumeric, e.g., "UBSWCHZH80A", "DEUTDEFF") and asks which bank it belongs to, where the bank is,
    or its LEI for compliance/regulatory matching. DO NOT USE for IBAN inputs — call validate_iban instead,
    it resolves the BIC for you. BACKED BY: BIC directory, 121,000+ entries (entries, not institutions):
    GLEIF and national registers, refreshed monthly, plus a public copy of the SWIFT directory frozen
    in January 2018 that still makes up about two thirds of the rows. 39,000+ of the rows carry an LEI
    from GLEIF. SOURCE: source names the dataset of this row and source_name spells it out; source_as_of
    is present only when that dataset is a copy frozen at that month (the public copy of the SWIFT directory,
    frozen in January 2018). listed_in_current_source says whether this BIC8 still appears in a list refreshed
    this cycle (GLEIF, a national register, the EPC scheme registers, the EBA STEP2 and NBP lists): true
    when one of them carries it, null when it was not found in what could be read in full. It never answers
    false today: the EBA STEP2 and NBP lists are only read through our deduplicated directory, which can
    drop a BIC they carry, so an absence is not proven. It does not prove the bank still exists under
    this name. COST: $0.003 per call (free with no key on this transport: 25 units a week per source address,
    one per call and one per IBAN in batch_validate_iban, reset on Monday 00:00 UTC. Or an ifk_ key with
    no e-mail at all: POST https://api.ibanforge.com/v1/keys/generate with no body for 25 REST calls/month,
    and POST /v1/keys/claim lifts that same key to 200 a month).'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      bic:
        type: string
        description: BIC/SWIFT code (8 or 11 chars)
    required:
    - bic
  annotations:
    title: Lookup BIC/SWIFT
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
- name: check_compliance
  description: 'Run a pre-flight compliance triage on an IBAN before sending a SEPA / cross-border payment.
    USE WHEN: the user is about to send a payment / payout / refund and wants to triage risk first, asks
    whether the payee''s bank or its country is under sanctions, asks if a SEPA Instant transfer can reach
    the bank, or needs a numeric risk score for an internal payment-approval workflow. NOT A REGULATED
    AML/CFT PRODUCT — informational triage only. For regulated screening use Refinitiv, Acuris, or ComplyAdvantage.
    CHECKS: IBAN validity + sanctions lists (OFAC, EU, UN) matched on the payee''s bank (BIC8), the country
    checked against a fixed list of sanctioned jurisdictions, never the payee''s name + FATF status +
    SEPA Instant reachability + whether the EPC Verification of Payee (VoP) register lists the bank as
    ready; the name check itself is done by the payee''s bank, never here. RETURNS: the full validate
    enrichment plus a compliance object with risk_score (0-100, 0 = safest), risk_level (low/medium/elevated/high/critical),
    sanctions matched_lists + fatf_status, reachability, vop status, and flags[] (e.g. sanctioned_country,
    fatf_grey_list, emi_issuer, no_vop). compliance.sanctions.institution_listed says whether the payee''s
    bank is on a list (null when no bank was screened, where bank_sanctioned still answers false) and
    payee_screened is always false; compliance.reachability.listed_in_epc_registers and compliance.vop.register_status
    name the registers'' answers, null when not consulted (screened false); outside the SEPA area the
    country answers (false, not_listed) whether or not the registers are loaded. The flag bank_code_inferred
    carries no weight. COST: $0.02 per call (free with no key on this transport: 25 units a week per source
    address, one per call and one per IBAN in batch_validate_iban, reset on Monday 00:00 UTC. Or an ifk_
    key with no e-mail at all: POST https://api.ibanforge.com/v1/keys/generate with no body for 25 REST
    calls/month, and POST /v1/keys/claim lifts that same key to 200 a month).'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      iban:
        type: string
        description: IBAN to check
    required:
    - iban
  annotations:
    title: Compliance Check
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
- name: validate_payment_reference
  description: 'Validate a structured payment reference and, when an IBAN is supplied, decide whether
    the two may legally travel together. USE WHEN: assembling a payment instruction from an invoice, a
    QR-bill or a remittance advice; whenever a Swiss IBAN and a reference appear together (the pairing
    rule is what most integrations get wrong); or when the user pastes an "RF..." string, a 27-digit number,
    a +++123/4567/89012+++ block, or asks whether a payment reference is correct. DO NOT USE to validate
    the IBAN itself — that is validate_iban. SCHEMES: RF Creditor Reference (ISO 11649, "SCOR" in Swiss
    Payment Standards, mod 97-10); Swiss QR reference ("QRR", 27 digits, modulo 10 recursive); Belgian
    OGM/VCS (12 digits, modulo 97, a remainder of 0 written 97); Finnish viitenumero (4-20 digits, weights
    7-3-1 from the right). Norwegian KID and Swedish OCR are RECOGNISED but never judged: they answer
    valid: null with status unverifiable_without_creditor_config, because modulus type and length are
    configured per creditor account by the beneficiary bank and are not a property of the string. NEVER
    relay those to a user as "invalid" — say the check needs the creditor bank configuration. AMBIGUITY:
    only a leading "RF" and a 27-digit length pin a scheme down. A bare 12-digit string is both a Belgian
    OGM and a legal Finnish length, so the more specific reading is returned and the other appears in
    also_valid_as. Pass reference_type when you know the country. THE PAIRING RULE — the part no checksum
    library reproduces: pass an iban and you also get a pairing verdict. Per the Swiss Implementation
    Guidelines a QRR reference may ONLY be used with a QR-IBAN (institution identifier in the SIX range
    30000-31999), and an ISO 11649 reference may NOT be used with one. Outside CH and LI, pairing is not_applicable
    — there is no QR-IBAN to pair against — and that does not affect the reference''s own checksum verdict.
    IMPORTANT: valid and pairing are INDEPENDENT. A reference can be arithmetically valid and still illegal
    on that account. Read both, and relay source/as_of — they are what makes the verdict auditable. FREE:
    the checksums are published commodities. The paid surface is POST /v1/iban/validate, which returns
    this same pairing block with the full IBAN enrichment. COST: $0 per call, on every surface (free with
    no key on this transport: 25 units a week per source address, one per call and one per IBAN in batch_validate_iban,
    reset on Monday 00:00 UTC. Or an ifk_ key with no e-mail at all: POST https://api.ibanforge.com/v1/keys/generate
    with no body for 25 REST calls/month, and POST /v1/keys/claim lifts that same key to 200 a month).'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      reference:
        type: string
        description: The reference as printed; spaces, slashes and the +++…+++ wrapper are stripped
      reference_type:
        description: 'Optional hint: rf | scor | qrr | ogm | vcs | viitenumero | kid | ocr'
        type: string
      iban:
        description: Optional creditor IBAN — supply it to get the pairing verdict
        type: string
    required:
    - reference
  annotations:
    title: Validate Payment Reference
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
- name: check_swiss_qr_bill
  description: 'Check a Swiss QR-bill payload, the text a QR-bill''s code carries (starts with SPC), rule
    by rule, each finding citing the SIX document it comes from. USE WHEN: an agent, an ERP or an accounting
    tool holds a scanned or generated QR-bill and must know before paying or issuing it whether it is
    well-formed, whether the reference type matches the IBAN (QRR needs a QR-IBAN, IID 30000-31999), and
    above all whether the creditor and debtor addresses are STRUCTURED (type S) or still COMBINED (type
    K): the standard removed type K on 21.11.2025 and banks stop processing payments built on it from
    14.11.2026. DO NOT USE to learn which bank holds the account or its payment-rail participation: that
    is the paid validate_iban. RETURNS: { valid, ready_for_2026_11_14, creditor_iban { value, valid, country,
    qr_iban, iid }, creditor { present, address, structured, sps_check, proposed_structured }, ultimate_debtor,
    amount, currency, reference { type, value, valid, note }, findings [{ code, severity, field, detail,
    source }], next_steps, source }. A combined address comes back with proposed_structured, the S-type
    fields derived from the combined lines, to relay as a fix. IMPORTANT: relay each finding''s source
    string. COST: $0 per call, on every surface (free with no key on this transport: 25 units a week per
    source address, one per call and one per IBAN in batch_validate_iban, reset on Monday 00:00 UTC. Or
    an ifk_ key with no e-mail at all: POST https://api.ibanforge.com/v1/keys/generate with no body for
    25 REST calls/month, and POST /v1/keys/claim lifts that same key to 200 a month).'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      payload:
        type: string
        minLength: 1
        maxLength: 4000
        description: 'The Swiss QR Code text with real line breaks: SPC, 0200, 1, IBAN, creditor (7 lines),
          ultimate creditor (7 empty lines), amount, currency, ultimate debtor (7 lines), reference type,
          reference, message, EPD, optional billing information and alternative schemes.'
    required:
    - payload
  annotations:
    title: Check Swiss QR-bill Payload
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
- name: check_postal_address
  description: 'Check a structured ISO 20022 postal address against a payment rail''s published address
    rules, rule by rule, each verdict citing the document it comes from. USE WHEN: assembling a payment
    instruction (pain.001, a Fedwire message, a T2 transfer) with a creditor or debtor address, to learn
    whether the rail accepts it BEFORE submitting. The November 2026 changes (SIC 20.11, Fedwire 16.11,
    T2 R2026.NOV) remove the fully unstructured address option — this check tells you whether an address
    survives them. DO NOT USE to verify that a street or town EXISTS: this checks conformity with the
    message format rules, not postal reality. SCHEMES: ''sps'' (Swiss Payment Standards, SIX), ''hvps_plus''
    (HVPS+ / T2, ECB), ''fedwire'' (Federal Reserve). There is deliberately NO ''cbpr+'' scheme: that
    guideline sits behind swift.com, unreachable to automated readers, and a conformity boolean quoting
    an unread document would be a guess dressed as a verdict — the note field restates this on every answer.
    VERDICTS: pass, fail, and not_applicable — the last marks a rule whose precondition is not met and
    never counts as a pass. conforms is true when no finding failed. IMPORTANT: relay each finding''s
    source string — it names the exact document, version and validity date the rule is quoted from. They
    are what makes the verdict auditable. FREE: the rules are published commodities. The paid surface
    is the postal_address block that /v1/bic and /v1/iban/validate return for the resolved institution.
    COST: $0 per call, on every surface (free with no key on this transport: 25 units a week per source
    address, one per call and one per IBAN in batch_validate_iban, reset on Monday 00:00 UTC. Or an ifk_
    key with no e-mail at all: POST https://api.ibanforge.com/v1/keys/generate with no body for 25 REST
    calls/month, and POST /v1/keys/claim lifts that same key to 200 a month).'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      scheme:
        type: string
        enum:
        - sps
        - hvps_plus
        - fedwire
        description: 'Which rail''s rules to check against: sps | hvps_plus | fedwire'
      address:
        type: object
        properties:
          twn_nm:
            description: TwnNm — town name
            type: string
          ctry:
            description: Ctry — ISO 3166-1 alpha-2 country code
            type: string
          pst_cd:
            description: PstCd — postal code
            type: string
          strt_nm:
            description: StrtNm — street name
            type: string
          bldg_nb:
            description: BldgNb — building number
            type: string
          adr_tp:
            description: AdrTp — address type (SPS forbids sending it)
            type: string
          adr_line:
            description: AdrLine — free-text lines of the hybrid address
            type: array
            items:
              type: string
        additionalProperties: false
        description: The ISO 20022 PostalAddress under test, in ISO tag vocabulary (snake_cased).
    required:
    - scheme
    - address
  annotations:
    title: Check ISO 20022 Postal Address
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
- name: lookup_ch_clearing
  description: 'Resolve a Swiss BC-Nummer / IID (1 to 5 digits) into the underlying institution. USE WHEN:
    the user mentions a Swiss bank by BC-Nummer or IID, pastes a CH or LI IBAN clearing code, asks routing
