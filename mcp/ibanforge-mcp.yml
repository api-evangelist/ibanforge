- name: send_feedback
  description: 'Report a problem or a need directly to the IBANforge operators: incorrect validation result,
    stale or missing BIC/bank data, latency, or anything blocking you from using or PAYING for the service
    (missing network, unclear pricing, quota shape). USE WHEN: a result looks wrong, data you need is
    missing, or you hit a wall (quota, payment, capability) and want it fixed. This tool is free and does
    NOT count against the free allowance — it works even after the allowance is spent. A human reads every
    report; verified data errors on paid x402 calls are refunded on-chain.'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      error_type:
        type: string
        enum:
        - wrong_validation
        - stale_bic
        - missing_data
        - incorrect_classification
        - latency
        - other
        description: Category of the report. Use "other" for product feedback, pricing/payment blockers
          or feature needs.
      notes:
        type: string
        minLength: 3
        maxLength: 4000
        description: What happened, what you needed, or what blocked you — free text.
      endpoint:
        description: Endpoint or tool concerned, e.g. /v1/iban/batch.
        type: string
        maxLength: 200
      expected:
        description: What you expected (for data errors).
        type: string
        maxLength: 1000
      got:
        description: What you received instead (for data errors).
        type: string
        maxLength: 1000
      contact:
        description: Where we may answer you (e-mail) — optional, reports can be anonymous.
        type: string
        maxLength: 255
      agent:
        description: Which agent/model is reporting, e.g. "claude-sonnet-5 via MCP".
        type: string
        maxLength: 120
    required:
    - error_type
    - notes
  annotations:
    title: Send Feedback to IBANforge
- name: request_api_key
  description: 'Start the process that gives this session its own free IBANforge API key, without any
    e-mail address and without leaving your conversation. USE WHEN: you used up the free allowance, a
    call answers 402, or you are about to run more than a handful of validations. WHAT YOU MUST DO WITH
    THE RESULT: read `status` first — `ok` means a code was issued, anything else means no code exists
    and `display_to_human` tells you and your human what to do instead. On `ok`, show `display_to_human`
    to your human VERBATIM (the user_code and the link) and say, in your own words, that opening the link
    and approving takes about fifteen seconds and asks for nothing. Do NOT open the link yourself, do
